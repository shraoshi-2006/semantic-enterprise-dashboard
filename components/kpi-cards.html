<!-- Accessible KPI Metrics Cards Component (<section>, <article>) -->
<section aria-labelledby="comp-kpi-heading" class="kpi-grid">
  <h2 id="comp-kpi-heading" class="sr-only">Key Infrastructure Metrics</h2>

  <article class="kpi-card" aria-labelledby="comp-card-1">
    <div class="kpi-header">
      <span class="kpi-title" id="comp-card-1">Cluster Availability</span>
      <span class="kpi-icon-pill" aria-hidden="true">⚡</span>
    </div>
    <div class="kpi-value">99.99%</div>
    <div class="kpi-trend trend-positive">
      <span aria-hidden="true">✓</span>
      <span>Tier 4 Gold SLA</span>
    </div>
  </article>

  <article class="kpi-card" aria-labelledby="comp-card-2">
    <div class="kpi-header">
      <span class="kpi-title" id="comp-card-2">Monthly Bandwidth</span>
      <span class="kpi-icon-pill" aria-hidden="true">🌐</span>
    </div>
    <div class="kpi-value">142 TB</div>
    <div class="kpi-trend trend-neutral">
      <span>On budget</span>
    </div>
  </article>
</section>
